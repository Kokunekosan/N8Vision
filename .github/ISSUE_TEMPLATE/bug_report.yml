name: Bug report
description: Tell us what broke in N8Vision.
title: "[Bug]: "
body:
  - type: input
    id: version
    attributes:
      label: N8Vision version
      placeholder: I.2t-l-Z2v
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Your computer
      description: Windows version, Python version, GPU (if any), and browser.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: Steps that someone else can follow to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Attach screenshots or paste relevant console output. Remove credentials.
  - type: textarea
    id: beside_recovery
    attributes:
      label: Beside recovery details (if applicable)
      description: If Beside removed an original, include the run-mode sequence, version, donor/output paths (redact personal folders), on-disk versus grid state, and recovery mode/donor/output console lines. This isolated historical report has not been reproduced.
